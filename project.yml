name: Choclift
options:
  bundleIdPrefix: com.choclift
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ChocliftCoreMac:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Packages/ChocliftCore/Sources/ChocliftCore
    settings:
      base:
        PRODUCT_MODULE_NAME: ChocliftCore
        DEFINES_MODULE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  ChocliftCoreIOS:
    type: library.static
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Packages/ChocliftCore/Sources/ChocliftCore
    settings:
      base:
        PRODUCT_MODULE_NAME: ChocliftCore
        DEFINES_MODULE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  ChocliftCoreWatch:
    type: library.static
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Packages/ChocliftCore/Sources/ChocliftCore
    settings:
      base:
        PRODUCT_MODULE_NAME: ChocliftCore
        DEFINES_MODULE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  ChocliftMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Apps/ChocliftMac
        excludes:
          - "Info.plist"
          - "ChocliftMac.entitlements"
    dependencies:
      - target: ChocliftCoreMac
    info:
      path: Apps/ChocliftMac/Info.plist
      properties:
        CFBundleDisplayName: choclift
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: "choclift 通过本地局域网连接你的 iPhone、iPad 或 Apple Watch 触控栏。"
        NSBluetoothAlwaysUsageDescription: "choclift 在不处于同一 Wi-Fi 时通过蓝牙低功耗 (BLE) 广播配对服务，接收来自 iPhone、iPad 或 Apple Watch 的触控栏指令。"
        NSBluetoothPeripheralUsageDescription: "choclift 在不处于同一 Wi-Fi 时通过蓝牙广播 Mac 触控栏配对服务。"
        NSBonjourServices:
          - "_choclift._tcp"
        NSAppleEventsUsageDescription: "choclift 使用自动化脚本在点击网页书签时切换到已打开的浏览器标签页。"
        SUPublicEDKey: "sW8VDD67w99pj0oQLD8p5nIWgkEzM2FV/sBbmnu5vxw="
    entitlements:
      path: Apps/ChocliftMac/ChocliftMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choclift.mac
        PRODUCT_NAME: Choclift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        DEVELOPMENT_TEAM: 4257SFGRFK
        # CI 传 PROVISIONING_PROFILE_SPECIFIER=$(CHOCLIFT_DEVELOPER_ID_PROFILE) 时仅在 ChocliftMac 展开，避免静态库报错
        CHOCLIFT_DEVELOPER_ID_PROFILE: "Choclift Developer ID"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: "Choclift Developer ID"

  ChocliftIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Apps/ChocliftIOS
        excludes:
          - "Info.plist"
    dependencies:
      - target: ChocliftCoreIOS
      - target: ChocliftWatch
        embed: true
    info:
      path: Apps/ChocliftIOS/Info.plist
      properties:
        CFBundleDisplayName: choclift
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: "choclift 通过同一局域网 Wi-Fi 与你的 Mac 实时同步触控栏操作。"
        NSBluetoothAlwaysUsageDescription: "choclift 在不处于同一 Wi-Fi 时，通过蓝牙与 Mac 配对并发送触控栏操作。"
        NSBluetoothPeripheralUsageDescription: "choclift 在不处于同一 Wi-Fi 时，通过蓝牙与 Mac 配对并发送触控栏操作。"
        NSBonjourServices:
          - "_choclift._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choclift.ios
        PRODUCT_NAME: Choclift
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEVELOPMENT_TEAM: 4257SFGRFK
        CODE_SIGN_STYLE: Automatic
        # CI 归档传 CODE_SIGN_STYLE=Manual 时生效；本地/模拟器 Automatic 构建自动忽略
        PROVISIONING_PROFILE_SPECIFIER: "Choclift AppStore"
        AD_HOC_CODE_SIGNING_ALLOWED: YES

  ChocliftWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Apps/ChocliftWatch
        excludes:
          - "Info.plist"
    dependencies:
      - target: ChocliftCoreWatch
    info:
      path: Apps/ChocliftWatch/Info.plist
      properties:
        CFBundleDisplayName: choclift
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.choclift.ios
        WKRunsIndependentlyOfCompanionApp: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: "choclift 通过同一局域网 Wi-Fi 与你的 Mac 实时同步腕上触控栏与快捷控制。"
        NSBluetoothAlwaysUsageDescription: "choclift 在手表与 Mac 不在同一 Wi-Fi 时，通过蓝牙配对并发送快捷控制。"
        NSBluetoothPeripheralUsageDescription: "choclift 在手表与 Mac 不在同一 Wi-Fi 时，通过蓝牙配对并发送快捷控制。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - "_choclift._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choclift.ios.watchkitapp
        PRODUCT_NAME: ChocliftWatch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEVELOPMENT_TEAM: 4257SFGRFK
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: "Choclift Watch AppStore"
        AD_HOC_CODE_SIGNING_ALLOWED: YES

schemes:
  ChocliftMac:
    build:
      targets:
        ChocliftMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ChocliftIOS:
    build:
      targets:
        ChocliftIOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  ChocliftWatch:
    build:
      targets:
        ChocliftWatch: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
